[package]
name = "respan-gateway-plugin-commandcode-quota"
description = "First-party plugin: route only to Command Code accounts with usable quota."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
http.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http-faults.workspace = true
respan-gateway-plugin-routing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
respan-gateway-conversation = { path = "../../kinds/conversation" }
respan-gateway-conversation-http.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "26cf441" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
